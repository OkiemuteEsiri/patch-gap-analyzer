name: security-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python -m patch_gap.cli data/sample_inventory.json --as-of 2026-09-01 --output /tmp/patch-gap-report.md
      - name: Validate report
        run: test -s /tmp/patch-gap-report.md && grep -q "Patch Gap Assessment" /tmp/patch-gap-report.md
